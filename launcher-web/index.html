<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darksham Launcher</title>
<link rel="stylesheet" href="css/style.css">
<!--DARKSHAM_TOKEN-->
</head>
<body>
<div id="stage">

  <!-- background: hero art (cross-faded), blurred fill, light, grain -->
  <div class="bg">
    <div class="fill"><img class="a" alt=""><img class="b" alt=""></div>
    <div class="hero"><img class="a" alt=""><img class="b" alt=""></div>
    <canvas id="aurora" width="480" height="270"></canvas>
    <div class="scrim"></div>
    <canvas id="motes" width="960" height="540"></canvas>
    <div class="grain"></div>
  </div>

  <!-- top bar -->
  <header class="top">
    <img class="brand" src="assets/logo.png" alt="Darksham">
    <nav class="tabs" id="tabs">
      <span class="pill"></span>
      <button data-tab="games"></button>
      <button data-tab="store"></button>
      <button data-tab="profile"></button>
      <button data-tab="apps"></button>
    </nav>
    <div class="status glass">
      <span id="clock">21:40</span>
      <svg class="ico" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10.5 10.5 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" class="f"/></svg>
      <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3"/><rect x="4" y="9" width="11" height="6" rx="1" class="f"/></svg>
      <span class="avatar">D</span>
    </div>
  </header>

  <!-- selected game -->
  <main class="info" id="info">
    <div class="logo-wrap"><img id="logo" alt=""><h1 id="title"></h1></div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button class="play" id="play">
        <svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
        <i class="spin"></i><span id="play-label"></span>
        <kbd id="play-key"></kbd>
      </button>
      <button class="round glass" id="fav" aria-label="favourite">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.7 3.7 4.5 7 4.5c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.3 0 5.4 3.2 4.2 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>
      </button>
      <button class="round glass" id="more" aria-label="more">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" class="f"/><circle cx="12" cy="12" r="1.6" class="f"/><circle cx="18.5" cy="12" r="1.6" class="f"/></svg>
      </button>
    </div>
  </main>

  <!-- store: sub-tabs (shelves) and the "our own store is coming" note -->
  <div class="shelves" id="shelves"></div>
  <div class="store-note" id="store-note"></div>
  <div class="store-msg glass" id="store-msg"><i class="spin"></i><p id="store-msg-text"></p><button class="chip" id="store-retry"></button></div>

  <!-- the row of cards -->
  <section class="row" id="row"></section>

  <!-- other tabs -->
  <section class="page" id="page-profile">
    <div class="who">
      <span class="avatar big">D</span>
      <div><h2 id="p-name"></h2><p id="p-sub"></p></div>
    </div>
    <div class="panel" id="p-panel">
      <div class="stats" id="p-tiles"></div>
      <div class="bars" id="p-bars"></div>
    </div>
  </section>
  <section class="page" id="page-apps">
    <h2 id="a-title"></h2>
    <p id="a-sub"></p>
    <div class="ghosts"><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <!-- store: game details -->
  <section class="detail" id="detail">
    <div class="sheet glass">
      <button class="round glass x" id="d-close" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="gallery"><div class="shots"><img id="shot-a" alt=""><img id="shot-b" alt=""></div><div class="thumbs" id="shot-thumbs"></div></div>
      <div class="meta">
        <h2 id="d-title"></h2>
        <div class="chips" id="d-chips"></div>
        <p id="d-desc"></p>
        <dl id="d-facts"></dl>
        <div class="buy">
          <div class="price" id="d-price"></div>
          <button class="play" id="d-open"><span id="d-open-label"></span><kbd id="d-open-key"></kbd></button>
        </div>
      </div>
    </div>
  </section>

  <footer class="hints" id="hints"></footer>
  <div class="toast glass" id="toast"></div>
</div>

<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
